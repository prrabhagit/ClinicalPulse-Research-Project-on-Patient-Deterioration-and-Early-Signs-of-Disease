[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicalpulse"
version = "0.1.0"
description = "Multimodal clinical decision-support and early-warning research project"
requires-python = ">=3.10"
dependencies = ["pypdf>=4.0"]

[project.optional-dependencies]
imaging = ["torch", "torchvision", "scikit-learn", "pandas", "numpy", "pillow", "matplotlib"]
ocr = ["pytesseract", "pillow"]
dev = ["pytest", "reportlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
